name: "🔨 Hammers (Packaging)"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hammer-build:
    name: Debian (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CGO_ENABLED: "1"

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config dpkg-dev \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            xvfb xauth
          useradd --create-home --shell /bin/bash artisan

      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Build runs as artisan, with its own module and compilation caches.
          cache: false

      - name: Prepare unprivileged build
        run: chown -R artisan:artisan "$GITHUB_WORKSPACE"

      - name: Run tests
        run: runuser -u artisan -- env PATH="$PATH" xvfb-run -a make test

      - name: Build Debian package
        run: runuser -u artisan -- env PATH="$PATH" make package

      - name: Inspect Debian package
        run: |
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"
          test "$(dpkg-deb --field "${packages[0]}" Package)" = penguins-gui
          test "$(dpkg-deb --field "${packages[0]}" Architecture)" = amd64

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: penguins-gui-debian-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  hammer-arch:
    name: Arch (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            ca-certificates git go pkgconf libglvnd libx11 libxcursor \
            libxrandr libxinerama libxi libxxf86vm libxkbcommon \
            xorg-server-xvfb xorg-xauth
          useradd --create-home --shell /bin/bash artisan

      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Build runs as artisan, with its own module and compilation caches.
          cache: false

      - name: Prepare unprivileged build
        run: chown -R artisan:artisan "$GITHUB_WORKSPACE"

      - name: Run tests
        run: runuser -u artisan -- env PATH="$PATH" xvfb-run -a make test

      - name: Build Arch package
        run: runuser -u artisan -- env PATH="$PATH" make package

      - name: Inspect Arch package
        run: |
          packages=(dist/*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          pacman -Qip "${packages[0]}"
          pacman -Qlp "${packages[0]}"
          bsdtar -xOf "${packages[0]}" .PKGINFO | grep -Fx 'pkgname = penguins-gui'
          bsdtar -xOf "${packages[0]}" .PKGINFO | grep -Fx 'arch = x86_64'

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: penguins-gui-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  hammer-manjaro:
    name: Manjaro (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: manjarolinux/base:latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel ca-certificates git go pkgconf libglvnd libx11 libxcursor \
            libxrandr libxinerama libxi libxxf86vm libxkbcommon \
            xorg-server-xvfb xorg-xauth
          useradd --create-home --shell /bin/bash artisan

      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Build runs as artisan, with its own module and compilation caches.
          cache: false

      - name: Prepare unprivileged build
        run: chown -R artisan:artisan "$GITHUB_WORKSPACE"

      - name: Run tests
        run: runuser -u artisan -- env PATH="$PATH" xvfb-run -a make test

      - name: Build Manjaro package
        run: runuser -u artisan -- env PATH="$PATH" make package

      - name: Inspect Manjaro package
        run: |
          packages=(dist/*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          pacman -Qip "${packages[0]}"
          pacman -Qlp "${packages[0]}"
          bsdtar -xOf "${packages[0]}" .PKGINFO | grep -Fx 'pkgname = penguins-gui'
          bsdtar -xOf "${packages[0]}" .PKGINFO | grep -Fx 'arch = x86_64'

      # Arch and Manjaro generate the same filename; keep both release assets.
      - name: Name Manjaro release asset
        run: |
          packages=(dist/*.pkg.tar.zst)
          mv "${packages[0]}" "${packages[0]%.pkg.tar.zst}-manjaro.pkg.tar.zst"

      - name: Upload Manjaro package
        uses: actions/upload-artifact@v4
        with:
          name: penguins-gui-manjaro-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  hammer-fedora:
    name: Fedora 44 (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            ca-certificates git make gcc golang rpm-build redhat-rpm-config shadow-utils util-linux \
            pkgconf-pkg-config libX11-devel libXcursor-devel libXrandr-devel \
            libXinerama-devel libXi-devel libXxf86vm-devel mesa-libGL-devel \
            libxkbcommon-devel wayland-devel xorg-x11-server-Xvfb xorg-x11-xauth
          useradd --create-home --shell /bin/bash artisan

      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Build runs as artisan, with its own module and compilation caches.
          cache: false

      - name: Prepare unprivileged build
        run: chown -R artisan:artisan "$GITHUB_WORKSPACE"

      - name: Run tests
        run: runuser -u artisan -- env PATH="$PATH" xvfb-run -a make test

      - name: Build Fedora package
        run: runuser -u artisan -- env PATH="$PATH" make package

      - name: Inspect Fedora package
        run: |
          packages=(dist/*.rpm)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          rpm -qip "${packages[0]}"
          rpm -qlp "${packages[0]}"
          rpm -qp --requires "${packages[0]}"
          test "$(rpm -qp --queryformat '%{NAME}' "${packages[0]}")" = penguins-gui
          test "$(rpm -qp --queryformat '%{ARCH}' "${packages[0]}")" = x86_64

      - name: Upload Fedora package
        uses: actions/upload-artifact@v4
        with:
          name: penguins-gui-fedora-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  hammer-opensuse:
    name: openSUSE Tumbleweed (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Install build dependencies
        run: |
          zypper --non-interactive install --no-recommends \
            ca-certificates git make gcc rpm-build shadow util-linux \
            pkg-config libX11-devel libXcursor-devel libXrandr-devel \
            libXinerama-devel libXi-devel libXxf86vm-devel Mesa-libGL-devel \
            libxkbcommon-devel wayland-devel xorg-x11-server-Xvfb xauth xvfb-run
          useradd --create-home --user-group --shell /bin/bash artisan

      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Build runs as artisan, with its own module and compilation caches.
          cache: false

      - name: Prepare unprivileged build
        run: chown -R artisan:artisan "$GITHUB_WORKSPACE"

      - name: Run tests
        run: runuser -u artisan -- env PATH="$PATH" xvfb-run -a make test

      - name: Build openSUSE package
        run: runuser -u artisan -- env PATH="$PATH" make package

      - name: Inspect openSUSE package
        run: |
          packages=(dist/*.rpm)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          rpm -qip "${packages[0]}"
          rpm -qlp "${packages[0]}"
          rpm -qp --requires "${packages[0]}"
          test "$(rpm -qp --queryformat '%{NAME}' "${packages[0]}")" = penguins-gui
          test "$(rpm -qp --queryformat '%{ARCH}' "${packages[0]}")" = x86_64

      - name: Upload openSUSE package
        uses: actions/upload-artifact@v4
        with:
          name: penguins-gui-opensuse-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hammer-build, hammer-arch, hammer-manjaro, hammer-fedora, hammer-opensuse]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: penguins-gui-*
          merge-multiple: true
          path: dist
      - name: Publish package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./*.deb ./*.pkg.tar.zst ./*.rpm > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.deb ./*.pkg.tar.zst ./*.rpm SHA256SUMS \
            --verify-tag --title "Penguins GUI $RELEASE_TAG" \
            --notes-file ../RELEASE_NOTES.md
